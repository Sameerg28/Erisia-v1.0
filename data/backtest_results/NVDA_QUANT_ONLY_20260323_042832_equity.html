      color: var(--muted);

      padding: 18px;

    .panel canvas {
      width: 100%;
      height: 340px;
    }
    .panel.regime canvas {

      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

        scales: commonScales,
      },
      plugins: [regimeBandPlugin],
    });
    new Chart(document.getElementById("drawdownChart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Drawdown %",
          data: drawdownData,
          borderColor: "#f87171",
          backgroundColor: "rgba(248, 113, 113, 0.24)",
          fill: "origin",
          pointRadius: 0,
          tension: 0.16,
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          ...commonScales,
          y: {
            ...commonScales.y,
            ticks: {
              color: "#8b9bb0",
              callback(value) {
                return `${value}%`;
              },
            },
          },
        },
      },
    });
    new Chart(document.getElementById("regimeChart"), {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Regime",
          data: regimeData,
          backgroundColor: regimeBarColors,
          borderWidth: 0,
          barPercentage: 1.0,
          categoryPercentage: 1.0,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label(context) {
                return regimeLabels[context.dataIndex] || "UNKNOWN";
              },
            },
          },
        },
        scales: {
          x: { ticks: { display: false }, grid: { display: false } },
          y: { display: false, suggestedMin: 0, suggestedMax: 4, grid: { display: false } },
        },
      },
    });
  </script>
</body>
</html>
