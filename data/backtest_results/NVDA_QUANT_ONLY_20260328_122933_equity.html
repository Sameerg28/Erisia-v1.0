    :root {

    * { box-sizing: border-box; }
    body {
      margin: 0;

      background:

      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 20px 48px;

    .header {
      margin-bottom: 22px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.96), rgba(13, 17, 23, 0.92));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.7rem, 2.4vw, 2.6rem);
      letter-spacing: 0.03em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      background: rgba(17, 24, 39, 0.88);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel canvas {
      width: 100%;
      height: 340px;
    }
    .panel.regime canvas {
      height: 160px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
