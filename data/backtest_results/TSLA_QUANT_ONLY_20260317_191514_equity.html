      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .grid {

      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      background: rgba(17, 24, 39, 0.88);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);

      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;

    }
    .panel canvas {
      width: 100%;
      height: 340px;
    }
    .panel.regime canvas {

    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
